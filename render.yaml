services:
  - type: web
    name: naya-zehan-backend
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn backend.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        sync: false        # you will paste this manually in Render dashboard
      - key: ALLOWED_HOSTS
        sync: false        # you will paste your render domain manually
      - key: CORS_ALLOWED_ORIGINS
        sync: false        # you will paste your render domain manually
      - key: PYTHON_VERSION
        value: "3.10.12"